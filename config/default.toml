# Alure foundation. Missing keys use defaults; unknown keys are preserved.
version = 1
[runtime]
watch = true
reload_delay_ms = 200
[theme]
name = "midnight" # midnight, dawn, forest
font = "Sans Serif"
font_size = 13
spacing = 10
padding = 12
radius = 14
border_width = 1
opacity = 0.88
icon_mode = "builtin" # builtin or theme (QIcon/qt6ct with SVG fallback)
icon_size = 20
# Optional overrides: [theme.palette] background, surface, foreground, muted, accent, border
[settings]
width = 900
height = 680
editor_font = "monospace"
editor_font_size = 13
[foundation]
label = "Alure"
bold = true
show_icon = true
icon = "alure"
notice = "Foundation · services arrive in the next stage"
show_notice = true
[[panels]]
id = "main"
enabled = true
output = "primary" # primary, * (all outputs), or exact QScreen name
edge = "top" # top, bottom, left, right
thickness = 44
length = 0 # 0 = fill output; otherwise logical pixels, clamped to output
exclusive_zone = -1 # -1 = thickness + edge margin; 0 = no reservation; >0 = explicit
layer = "top" # background, bottom, top, overlay
margins = { top = 8, right = 8, bottom = 8, left = 8 }
modules = ["workspaces", "media", "tray", "volume", "updates", "wifi", "bluetooth", "notifications", "calendar", "battery"]

# Reserved service/UI contracts; these do not claim live functionality yet.
# command is always an argv array, never shell text. Service stages extend these.
[modules.workspaces]
enabled = true
[modules.workspaces.style]
show_icon = true
show_label = true
[modules.workspaces.behavior]
interval_ms = 1000
timeout_ms = 3000
command = ["niri", "msg", "--json", "workspaces"]
format = "{name}"
[modules.media]
enabled = true
[modules.media.style]
show_icon = true
show_label = true
[modules.media.behavior]
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{artist} — {title}"
[modules.tray]
enabled = true
[modules.tray.style]
show_icon = true
show_label = false
[modules.tray.behavior]
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{title}"
[modules.volume]
enabled = true
[modules.volume.style]
show_icon = true
show_label = true
[modules.volume.behavior]
interval_ms = 2000
timeout_ms = 3000
command = ["wpctl", "get-volume", "@DEFAULT_AUDIO_SINK@"]
format = "{percent}%"
[modules.updates]
enabled = true
[modules.updates.style]
show_icon = true
show_label = true
[modules.updates.behavior]
interval_ms = 1800000
timeout_ms = 120000
command = ["checkupdates"]
format = "{count}"
[modules.wifi]
enabled = true
[modules.wifi.style]
show_icon = true
show_label = true
[modules.wifi.behavior]
interval_ms = 10000
timeout_ms = 5000
command = ["nmcli", "-t", "-f", "ACTIVE,SSID,SIGNAL", "device", "wifi"]
format = "{ssid}"
[modules.bluetooth]
enabled = true
[modules.bluetooth.style]
show_icon = true
show_label = true
[modules.bluetooth.behavior]
interval_ms = 10000
timeout_ms = 5000
command = ["bluetoothctl", "show"]
format = "{status}"
[modules.notifications]
enabled = true
[modules.notifications.style]
show_icon = true
show_label = true
[modules.notifications.behavior]
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{count}"
[modules.calendar]
enabled = true
[modules.calendar.style]
show_icon = true
show_label = true
[modules.calendar.behavior]
interval_ms = 1000
timeout_ms = 3000
command = []
format = "ddd dd MMM · HH:mm"
[modules.battery]
enabled = true
[modules.battery.style]
show_icon = true
show_label = true
[modules.battery.behavior]
interval_ms = 30000
timeout_ms = 3000
command = []
format = "{percent}%"
