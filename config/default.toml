# Alure foundation. Missing keys use defaults; unknown keys are preserved.
version = 1
[runtime]
watch = true
reload_delay_ms = 200
[theme]
name = "midnight" # midnight, dawn, forest
font = "Sans Serif"
font_size = 13
spacing = 10
padding = 12
radius = 14
border_width = 1
opacity = 0.88
icon_mode = "builtin" # builtin or theme (QIcon/qt6ct with SVG fallback)
icon_size = 20
# Optional overrides: [theme.palette] background, surface, foreground, muted, accent, border
[settings]
width = 900
height = 680
editor_font = "monospace"
editor_font_size = 13
[foundation]
label = "Alure"
bold = true
show_icon = true
icon = "alure"
notice = "Foundation · module UI arrives in the next stage"
show_notice = true
[[panels]]
id = "main"
enabled = true
output = "primary" # primary, * (all outputs), or exact QScreen name
edge = "top" # top, bottom, left, right
thickness = 44
length = 0 # 0 = fill output; otherwise logical pixels, clamped to output
exclusive_zone = -1 # -1 = thickness + edge margin; 0 = no reservation; >0 = explicit
layer = "top" # background, bottom, top, overlay
margins = { top = 8, right = 8, bottom = 8, left = 8 }
modules = ["workspaces", "media", "tray", "volume", "updates", "wifi", "bluetooth", "notifications", "calendar", "battery"]

# Live service contracts; UI styles/formats are consumed by the UI stage.
# Commands are argv arrays, never shell text. Empty action commands disable actions.
[modules.workspaces]
enabled = true
[modules.workspaces.style]
show_icon = true
show_label = true
[modules.workspaces.behavior]
allow_actions = true
socket_path = "" # empty uses NIRI_SOCKET; reconnect at interval_ms
interval_ms = 1000
timeout_ms = 3000
command = [] # Native JSON socket, no subprocess
format = "{name}"
[modules.media]
enabled = true
[modules.media.style]
show_icon = true
show_label = true
[modules.media.behavior]
allow_actions = true
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{artist} — {title}"
[modules.tray]
enabled = true
[modules.tray.style]
show_icon = true
show_label = false
[modules.tray.behavior]
allow_actions = true
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{title}"
[modules.volume]
enabled = true
[modules.volume.style]
show_icon = true
show_label = true
[modules.volume.behavior]
allow_actions = true
set_volume_command = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@"]
mute_command = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
max_percent = 100
debounce_ms = 100
interval_ms = 2000
timeout_ms = 3000
command = ["wpctl", "get-volume", "@DEFAULT_AUDIO_SINK@"]
format = "{percent}%"
[modules.updates]
enabled = true
[modules.updates.style]
show_icon = true
show_label = true
[modules.updates.behavior]
allow_actions = true
update_command = [] # Explicit user action only; configure terminal + package manager argv
interval_ms = 1800000
timeout_ms = 120000
command = ["checkupdates"]
format = "{count}"
[modules.wifi]
enabled = true
[modules.wifi.style]
show_icon = true
show_label = true
[modules.wifi.behavior]
allow_actions = true
radio_command = ["nmcli", "radio", "wifi"]
radio_status_command = ["nmcli", "-t", "-f", "WIFI", "general"]
saved_command = ["nmcli", "-t", "-f", "UUID,NAME,TYPE", "connection", "show"]
connect_command = ["nmcli", "connection", "up", "uuid"]
interval_ms = 10000
timeout_ms = 5000
command = ["nmcli", "-t", "-f", "ACTIVE,SSID,SIGNAL", "device", "wifi", "list", "--rescan", "no"]
format = "{ssid}"
[modules.bluetooth]
enabled = true
[modules.bluetooth.style]
show_icon = true
show_label = true
[modules.bluetooth.behavior]
allow_actions = true
interval_ms = 10000
timeout_ms = 5000
command = [] # BlueZ DBus, no subprocess
format = "{status}"
[modules.notifications]
enabled = true
[modules.notifications.style]
show_icon = true
show_label = true
[modules.notifications.behavior]
allow_actions = true
server_enabled = false # opt in; never replaces another notification daemon
dnd = false
history_limit = 100
default_expire_ms = 5000
max_expire_ms = 86400000
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{count}"
[modules.calendar]
enabled = true
[modules.calendar.style]
show_icon = true
show_label = true
[modules.calendar.behavior]
interval_ms = 1000
timeout_ms = 3000
command = []
format = "ddd dd MMM · HH:mm"
[modules.battery]
enabled = true
[modules.battery.style]
show_icon = true
show_label = true
[modules.battery.behavior]
sysfs_path = "/sys/class/power_supply"
interval_ms = 30000
timeout_ms = 3000
command = []
format = "{percent}%"
