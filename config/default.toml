# Alure v0.1. Missing keys use defaults; unknown keys are preserved.
version = 1
[runtime]
watch = true
reload_delay_ms = 200
trace_windows = false # diagnostic stderr for auxiliary focus/rebuilds
[theme]
name = "midnight" # midnight, dawn, forest, onedark, catppuccin (Mocha), tokyonight (Night)
font = "Sans Serif"
font_size = 13
spacing = 10
padding = 12
radius = 14
border_width = 1
opacity = 0.88
icon_mode = "builtin" # builtin or theme (QIcon/qt6ct with SVG fallback)
icon_size = 18
icon_theme = "" # empty respects the desktop / qt6ct default
# Optional overrides: [theme.palette] background, surface, foreground, muted, accent, border
[settings]
module_tooltips = true # names and descriptions on palette/zone icons
module_tooltip_delay_ms = 400
close_shortcut = "Ctrl+W" # Qt portable shortcut; empty disables
controls_style = "Basic" # Basic or Fusion; restart settings/panels to change
width = 900
height = 680
editor_font = "monospace"
editor_font_size = 13
[ui]
panel_padding = 6
module_height = 30
popup_width = 440
popup_height = 560
popup_gap = 8 # Symmetric transparent padding; visual gap survives compositor flips.
popup_alignment = "center" # center, start, end along the chosen edge (outer popup bounds).
popup_direction = "inward" # inward, top, bottom, left, right; compositor may flip/slide.
animation_ms = 140
close_on_focus_loss = true # Additional focus-loss dismissal; native Wayland outside dismissal is mandatory.
escape_closes = true
toggle_on_click = true # pressing the same module button closes its dropdown
show_settings = true
settings_icon = "settings"
[ui.osd] # observed changes only; first reading and reloads are silent
enabled = true
volume_enabled = true # includes mute changes
screen_enabled = true
keyboard_enabled = true
volume_icon = "volume"
screen_icon = "brightness"
keyboard_icon = "keyboard"
output = "primary" # primary, * (all outputs), or exact screen name
width = 300
height = 100
margin_bottom = 64 # lower-center, logical pixels; ignores panel reservations
margin_horizontal = 16 # minimum clearance from either screen edge
duration_ms = 1800
padding = 16
spacing = 8
font_size = 14
icon_size = 24
show_icon = true
show_label = true
bar_height = 6
radius = 14
opacity = 0.92
background = "" # empty inherits theme palette
foreground = ""
accent = ""
[ui.toast]
enabled = true
output = "primary"
edge = "top" # top or bottom, right aligned
width = 320
height = 108
margin = 56
duration_ms = 5000
padding = 8
spacing = 4
font_size = 12
show_icon = true
icon_size = 32
body_lines = 2
[foundation] # deprecated compatibility keys; no longer rendered
label = "Alure"
bold = true
show_icon = true
icon = "alure"
notice = ""
show_notice = true
[[panels]]
id = "main"
enabled = true
output = "primary" # primary, * (all outputs), or exact QScreen name
edge = "top" # top, bottom, left, right
thickness = 44
length = 0 # 0 = fill output; otherwise logical pixels, clamped to output
window_gap = 0 # signed extra reservation; negative compensates compositor gaps
exclusive_zone = -1 # -1 = clamped thickness on wire; compositor adds edge margin
# 0 = no reservation; >0 = explicit protocol zone (also excludes edge margin)
layer = "top" # background, bottom, top, overlay
visibility = { mode = "always", show_delay_ms = 100, hide_delay_ms = 350, edge_trigger_px = 2, unknown_geometry = "hide" }
# mode: always, dodge-windows, auto-hide. Dynamic modes never reserve space.
# unknown_geometry: hide (conservative Niri tiled fallback) or show; also used while disconnected.
margins = { top = 8, right = 8, bottom = 8, left = 8 }
layout = "linear" # linear or three-zone; vertical panels use top/center/bottom
spacer_size = 24 # logical pixels for each @spacer; @stretch shares remaining space
modules = ["workspaces", "taskbar", "media", "tray", "volume", "brightness", "updates", "wifi", "bluetooth", "notifications", "clipboard", "calendar", "battery"]
modules_left = ["workspaces", "taskbar", "media"]
modules_center = ["calendar"]
modules_right = ["tray", "volume", "brightness", "updates", "wifi", "bluetooth", "notifications", "clipboard", "battery"]
# Lists accept @spacer, @stretch and @settings. Settings is appended if not placed.

# Module UI and live service contracts.
# Commands are argv arrays, never shell text. Empty action commands disable actions.
[modules.workspaces]
enabled = true
[modules.workspaces.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
active_indicator = "underline" # underline or pill; one shared icon per module
icon = "workspaces"
icon_size = 18
max_width = 240
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.workspaces.behavior]
popup_enabled = true
allow_actions = true
socket_path = "" # empty uses NIRI_SOCKET; reconnect at interval_ms
ordering = "output-index" # output name, numeric idx, numeric ID; or provider order
interval_ms = 1000
timeout_ms = 3000
command = [] # Native JSON socket, no subprocess
format = "{name}"
[modules.media]
enabled = true
[modules.media.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "media"
icon_size = 18
max_width = 240
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.media.behavior]
popup_width = 360
popup_height = 460
control_size = 40
control_icon_size = 26
preferred_player = "" # empty = playing first; otherwise full MPRIS service name/prefix
show_artwork = true
artwork_remote = true # load HTTP(S) cover art only while the media dropdown is visible
artwork_height = 160 # logical pixels
show_artist = true
show_album = true
show_progress = true
show_shuffle = true
show_repeat = true
popup_enabled = true
allow_actions = true
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{artist} — {title}"
[modules.clipboard]
enabled = true # lazy backend: no history reads until opened
[modules.clipboard.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "clipboard"
icon_size = 18
max_width = 140
min_width = 30
foreground = ""
background = ""
show_icon = true
show_label = false
[modules.clipboard.behavior]
popup_enabled = true
popup_width = 480
popup_height = 560
allow_actions = true
allow_delete = true
confirm_delete = true
close_on_copy = true
close_on_outside_click = true
copy_shortcut = "Return"
next_shortcut = "Down"
previous_shortcut = "Up"
cliphist_command = ["cliphist"]
copy_command = ["wl-copy"]
database_path = "" # CLIPHIST_DB_PATH or $XDG_CACHE_HOME/cliphist/db
interval_ms = 3000 # only polls while the history view is open
timeout_ms = 3000
max_items = 200
max_bytes = 5242880
max_image_pixels = 16777216
preview_image_size = 512
preview_cache_items = 24 # bounded in-memory inline thumbnails
inline_image_height = 160
inline_text_lines = 8
preview_text_chars = 8192
cursor_timeout_ms = 300
cursor_gap = 8
cursor_fallback = "center" # center on configured output, or cancel
output = "primary"
format = "{count}"
[modules.tray]
enabled = true
[modules.tray.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "tray"
icon_size = 18
max_width = 240
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = false
[modules.tray.behavior]
menu_width = 280 # anchored DBusMenu dropdown; logical pixels
menu_height = 420 # maximum dropdown height; scrolls on overflow
popup_enabled = true
allow_actions = true
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{title}"
[modules.volume]
enabled = true
[modules.volume.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "volume"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.volume.behavior]
backend = "auto" # auto, pipewire (wpctl), pulseaudio (pactl)
scroll_enabled = true
scroll_step = 5 # percentage points per wheel notch on the panel module
scroll_inverted = false
pulse_info_command = ["pactl", "--format=json", "info"]
pulse_sinks_command = ["pactl", "--format=json", "list", "sinks"]
pulse_set_volume_command = ["pactl", "set-sink-volume"] # Alure appends observed sink index and percent
pulse_mute_command = ["pactl", "set-sink-mute"] # Alure appends observed sink index and toggle
popup_enabled = true
allow_actions = true
set_volume_command = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@"]
mute_command = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
max_percent = 100
debounce_ms = 100
interval_ms = 2000
timeout_ms = 3000
command = ["wpctl", "get-volume", "@DEFAULT_AUDIO_SINK@"]
format = "{percent}%"
[modules.updates]
enabled = true
[modules.updates.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "updates"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.updates.behavior]
popup_enabled = true
allow_actions = true
update_command = [] # Explicit user action only; configure terminal + package manager argv
interval_ms = 1800000
timeout_ms = 120000
command = ["checkupdates"]
format = "{count}"
[modules.wifi]
enabled = true
[modules.wifi.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "wifi"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.wifi.behavior]
popup_enabled = true
allow_actions = true
radio_command = ["nmcli", "radio", "wifi"]
radio_status_command = ["nmcli", "-t", "-f", "WIFI", "general"]
saved_command = ["nmcli", "-t", "-f", "UUID,NAME,TYPE", "connection", "show"]
connect_command = ["nmcli", "connection", "up", "uuid"]
interval_ms = 10000
timeout_ms = 5000
command = ["nmcli", "-t", "-f", "ACTIVE,SSID,SIGNAL", "device", "wifi", "list", "--rescan", "no"]
format = "{ssid}"
[modules.bluetooth]
enabled = true
[modules.bluetooth.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "bluetooth"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.bluetooth.behavior]
popup_enabled = true
allow_actions = true
interval_ms = 10000
timeout_ms = 5000
command = [] # BlueZ DBus, no subprocess
format = "{status}"
[modules.notifications]
enabled = true
[modules.notifications.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "notifications"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.notifications.behavior]
focus_on_click = true # invoke the default action and focus an identifiable sender window
niri_socket = "" # empty uses NIRI_SOCKET
icon_max_pixels = 1048576 # bounded incoming images
icon_cache_kib = 8192
popup_enabled = true
allow_actions = true
toast_enabled = true
server_enabled = false # opt in; never replaces another notification daemon
dnd = false
persist_dnd = true # dropdown DND changes are saved to this TOML file
history_limit = 100
default_expire_ms = 5000
max_expire_ms = 86400000
interval_ms = 1000
timeout_ms = 3000
command = []
format = "{count}"
[modules.calendar]
enabled = true
[modules.calendar.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "calendar"
icon_size = 18
max_width = 240
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.calendar.behavior]
popup_enabled = true
allow_actions = true
first_day_of_week = 1 # 0 Sunday, 1 Monday
month_format = "MMMM yyyy"
interval_ms = 1000
timeout_ms = 3000
command = []
format = "ddd dd MMM · HH:mm"
[modules.battery]
enabled = true
[modules.battery.style]
opacity = 1.0 # per-module content and popup opacity, 0..1
icon = "battery"
icon_size = 18
max_width = 140
min_width = 30
foreground = "" # empty inherits theme
background = "" # empty uses transparent
show_icon = true
show_label = true
[modules.battery.behavior]
popup_enabled = true
sysfs_path = "/sys/class/power_supply"
interval_ms = 30000
timeout_ms = 3000
command = []
format = "{percent}%"

[modules.brightness]
enabled = true
[modules.brightness.style]
opacity = 1.0
icon = "brightness"
icon_size = 18
max_width = 140
min_width = 30
foreground = ""
background = ""
show_icon = true
show_label = true
[modules.brightness.behavior]
popup_enabled = true
allow_actions = true
interval_ms = 500 # external changes appear within one successful poll
timeout_ms = 3000
command = [] # native sysfs reads; no subprocess
set_command = ["brightnessctl"] # appends --class CLASS --device NAME set RAW_LEVEL
format = "{percent}%" # screen if available, otherwise keyboard
debounce_ms = 100
scroll_enabled = true
scroll_inverted = false
scroll_target = "screen" # screen or keyboard; each has its own native step
[modules.brightness.behavior.screen]
enabled = true
allow_actions = true
sysfs_path = "/sys/class/backlight"
device = "" # empty = first readable device sorted by name; exact basename otherwise
min_percent = 1
max_percent = 100
step = 5 # percent points per wheel notch/button press
[modules.brightness.behavior.keyboard]
enabled = true
allow_actions = true
sysfs_path = "/sys/class/leds"
device = "" # only names ending :kbd_backlight; excludes caps/mute LEDs
min_level = 0
max_level = -1 # -1 = hardware maximum; otherwise capped to hardware
step = 1 # discrete native levels, e.g. 0, 1, 2 (not percent)

# Real open Niri windows; no launchers, grouping, pinning or minimize emulation.
[modules.taskbar]
enabled = true
[modules.taskbar.style]
opacity = 1.0
active_indicator = "underline" # underline or pill, globally focused window
icon = "taskbar" # bundled fallback; desktop application icons take precedence
icon_size = 20 # 8..128 logical pixels
label_size = 13 # 6..72 logical pixels
# Each task's length when labels are enabled; icons-only uses icon + panel padding.
task_width = 160 # 16..512 logical pixels
max_width = 480 # scroll within this total module length, 16..2048
min_width = 30 # empty/unavailable button minimum, 16..1024
foreground = ""
background = ""
show_icon = true
show_label = false # Icons-only Task Manager; true shows title/app label
[modules.taskbar.behavior]
popup_enabled = true
allow_actions = true
focus_on_click = true # exact observed ID; never minimize on a second click
socket_path = "" # independent event stream; empty uses NIRI_SOCKET
workspace_scope = "all" # all, active (on each output), focused (single workspace)
output_scope = "panel" # all, panel (this panel output), focused (keyboard-focus output)
ordering = "id" # numeric stable ID, app-id, title; lexical sorts tie-break by ID
interval_ms = 1000 # reconnect retry, not snapshot polling
timeout_ms = 3000 # initial snapshot and action deadline
command = [] # native JSON event stream; no subprocess
format = "{title}" # per-task placeholders: title, app_id, id, output, workspace_id
